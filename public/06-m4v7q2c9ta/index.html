<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>06 - Who Am I</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">06 - Who Am I</h1>
              <p class="text-secondary mb-2">
                你顺利进入了第一个房间，并且发现了"似乎所有的门都是向外拉而不是向内推"这一世界级重大秘密。
              </p>
              <p class="text-secondary mb-2">
                但令人失望的是，房间里什么都没有。
              </p>
              <p class="text-secondary mb-2">
                你不甘心，又接连探索了好几个房间。
              </p>
              <p class="text-secondary mb-2">
                空空的房间仿佛在说：这里什么都木有呢，你已来到世界的尽头。
              </p>
              <p class="text-secondary mb-2">
                就在你有些沮丧的时候，走廊上的一台机器引起了你的注意。
              </p>
              <p class="text-secondary mb-2">
                根据标签，这是一台新入职员工自助领取工作 ID
                卡片的机器，只需要按下指纹即可精准识别身份，并全自动制作独一无二的工卡。
              </p>
              <p class="text-secondary mb-2">谁能忍住不试一试呢？</p>
              <div class="action-stack mt-4">
                <div class="action-row">
                  <button
                    id="getmyidcard"
                    class="btn btn-primary"
                    type="button"
                  >
                    按下自己的指纹
                  </button>
                </div>
                <p id="result" class="result-panel"></p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="/js/get_json_response.js"></script>
    <script src="/js/md5.js"></script>
    <script>
      const fingerprint = window.md5(String(Date.now()));
      get_json_response(
        'getmyidcard',
        'result',
        '/api/06?level=visitor&fingerprint=' + fingerprint
      );
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
