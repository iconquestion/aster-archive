<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>08 - A Book Without A Catalog</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">
                08 - A Book Without A Catalog
              </h1>
              <p class="text-secondary mb-2">
                从管理办公室出来，你拿着展出规划里的平面图去找旧书库。
              </p>
              <p class="text-secondary mb-2">
                走廊兜了几圈，图上标出的地方就在附近，入口却始终没找着。
              </p>
              <p class="text-secondary mb-2">
                平面图上那条通路，恰好断在一面墙前。
              </p>
              <p class="text-secondary mb-2">这时你注意到一张剥落的壁画。</p>
              <p class="text-secondary mb-2">
                你顺手撕了下来，露出了背后的墙。
              </p>
              <p class="text-secondary mb-0">
                墙上的字已经斑驳不清，需要费点力气才能勉强辨认。
              </p>

              <div class="action-stack mt-4">
                <div class="action-row">
                  <button id="clickme" class="btn btn-primary" type="button">
                    尝试辨认
                  </button>
                </div>
                <pre
                  id="result"
                  class="result-panel inline-code-block"
                  role="status"
                ></pre>
              </div>

              <div class="hint-panel mt-4">
                <details>
                  <summary>Hint</summary>
                  <p class="mb-0">本关当前位置可以视作独立的网站的根目录。</p>
                </details>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      let btn = document.getElementById('clickme');
      let result = document.getElementById('result');

      btn.addEventListener('click', function () {
        result.textContent = `
        // Robot Maintenance Room
        app.use(
          '/08-c2x8m5q9nv/',
          serveIndex(level08Dir, {
            icons: true,
            view: 'details',
          })
        );
        `;
        btn.disabled = true;
      });
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
