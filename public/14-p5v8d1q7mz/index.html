<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>14 - YOU SHALL NOT PASS</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">14 - YOU SHALL NOT PASS</h1>
              <p class="text-secondary mb-2">
                你在那幅一人高的画作背后发现了一扇暗门，
              </p>
              <p class="text-secondary mb-2">但这扇门无论如何都纹丝不动，</p>
              <p class="text-secondary mb-2">仿佛与这个空间融为一体。</p>
              <p class="text-secondary mb-2">一行小字写在不起眼的地方：</p>
              <p class="text-secondary mb-2">外来之人，你的旅途到此为止。</p>
              <p class="text-secondary mb-0">
                只有真正的主人，才知道进入的方法。
              </p>

              <div class="action-stack mt-4">
                <div class="action-row">
                  <button
                    id="try_to_open_the_door"
                    class="btn btn-primary"
                    type="button"
                  >
                    尝试打开暗门
                  </button>
                </div>
                <p
                  id="try_to_open_the_door_result"
                  class="result-panel"
                  role="status"
                ></p>
                <form
                  id="login_form"
                  class="list-surface"
                  action="/api/14/login"
                  method="post"
                  hidden
                >
                  <div class="row g-2">
                    <div class="col-12 col-sm">
                      <input
                        class="form-control"
                        type="text"
                        placeholder="username"
                        name="username"
                        aria-label="用户名"
                        disabled
                      />
                    </div>
                    <div class="col-12 col-sm">
                      <input
                        class="form-control"
                        type="password"
                        placeholder="password"
                        name="password"
                        aria-label="密码"
                        disabled
                      />
                    </div>
                    <div class="col-12 col-sm-auto">
                      <button
                        class="btn btn-outline-primary w-100"
                        type="submit"
                      >
                        查看门禁响应
                      </button>
                    </div>
                  </div>
                  <p id="login_result" class="mb-0" role="status"></p>
                </form>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      let cnt = 0;
      const threshold_cnt = 5;

      const btn = document.getElementById('try_to_open_the_door');
      const result = document.getElementById('try_to_open_the_door_result');
      const loginForm = document.getElementById('login_form');
      const loginResult = document.getElementById('login_result');

      btn.addEventListener('click', function () {
        result.innerText = '';
        cnt++;

        if (cnt >= threshold_cnt) {
          result.innerText = '邦邦卡邦！暗门弹出了一个登录界面！';
          console.log('2077年居然还在用传统的 B/S 登录...呜哇...');

          btn.disabled = true;
          loginForm.hidden = false;
        } else {
          result.innerText = '门：请输入文本\n(其实这只是你自己的内心戏)';
          console.log('其实就是没有反应嘛...');
        }
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginResult.textContent = '';
        try {
          const res = await fetch(loginForm.action, {
            method: 'POST',
          });
          const data = await res.json();
          if (!data?.message) throw new Error('Invalid response.');

          loginResult.textContent = data.message;
        } catch (err) {
          loginResult.textContent = '暂时无法读取门禁响应，请稍后再试。';
        }
      });
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
