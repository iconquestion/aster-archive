<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>01 - New Found Land</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">01 - New Found Land</h1>
              <p class="text-secondary mb-2">
                你在一次野外徒步旅行中发现了一座古老的建筑群。
              </p>
              <p class="text-secondary mb-2">
                远远望去，建筑的风格仿佛将人带回到上上个世纪的欧洲。
              </p>
              <p class="text-secondary mb-2">
                整座建筑群被高大而绵延的铁栅栏包围，如同一条细长的钢铁长龙，窝在起伏错落的山间，守着一方净土。
              </p>
              <p class="text-secondary mb-2">
                经历了岁月的漫长洗礼，栅栏已经锈迹斑斑，被深绿的藤蔓渐渐隐去了昔日的锋芒。
              </p>
              <p class="text-secondary mb-0">你决定沿着栅栏找找入口。</p>
              <div class="hint-panel mt-4">
                <details>
                  <summary>Hint</summary>
                  <p class="mb-0">
                    像拨开藤蔓一样，看看这个页面的表面底下藏着什么。
                  </p>
                </details>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
