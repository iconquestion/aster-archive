<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>05 - Not My Fault (Maybe)</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">05 - Not My Fault (Maybe)</h1>
              <p class="text-secondary mb-2">
                你循着钟的回音拐进一条先前漏看的岔道，在尽头找到一张泛黄的地图。
              </p>
              <p class="text-secondary mb-2">
                地图上的字大多看不清，只勉强认得二楼的平面图。
              </p>
              <p class="text-secondary mb-0">
                你把地图带上二楼，从离楼梯最近的那扇门开始。
              </p>
              <div class="action-stack mt-4">
                <div class="action-row">
                  <button id="push" class="btn btn-primary" type="button">
                    推一下门
                  </button>
                </div>
                <p id="responseMsg" class="result-panel" role="status"></p>
              </div>

              <div class="hint-panel mt-4">
                <details>
                  <summary>Hint</summary>
                  <p class="mb-0">"难道是我的打开方式有问题(OxO)?"</p>
                </details>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="/js/get_json_response.js"></script>
    <script>
      get_json_response('push', 'responseMsg', '/api/05');
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
