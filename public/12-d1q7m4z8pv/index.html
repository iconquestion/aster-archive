<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>12 - A Way Impossible To Find</title>
    <style>
      .vending-terminal {
        --bs-body-bg: #131e29;
        --bs-tertiary-bg: #1c2c38;
        --bs-tertiary-bg-rgb: 28, 44, 56;
        --bs-border-color: #344858;
        color: var(--bs-body-color);
        background: var(--bs-body-bg);
      }

      .terminal-screen {
        min-height: 17rem;
      }

      .terminal-result:empty {
        display: none;
      }

      .terminal-result p {
        margin-bottom: 0;
      }
    </style>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8 d-grid gap-3 gap-md-4">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-3 p-sm-4 puzzle-copy">
              <h1 class="h2 fw-bold mb-4">12 - A Way Impossible To Find</h1>
              <p class="mb-2">循着书里的线索，你回到了档案馆二楼。</p>
              <p class="mb-2">走到走廊的尽头，已经无路可走。</p>
              <p class="mb-2">
                通往上层的楼梯坍塌了下来，露出了扭曲的断层，让人望而却步。看来是行不通了。
              </p>
              <p class="mb-2">这时你看到有一台仍然在工作的售货机，</p>
              <p class="mb-2">显示着「搭载最新 AI 系统!」</p>
              <p class="mb-2">
                售货机被放置在楼梯的背后，从来时的方向恰好无法看到。
              </p>
              <p class="mb-0">它为什么会出现在那里？它可能是谜题的关键吗？</p>
              <div class="hint-panel mt-4">
                <details>
                  <summary>Hint</summary>
                  <p class="mb-0">不妨撞撞运气。</p>
                </details>
              </div>
            </div>
          </section>
          <section
            class="vending-terminal rounded-4 border overflow-hidden shadow-sm"
            data-bs-theme="dark"
            aria-label="AI 智能售货终端"
          >
            <header
              class="d-flex flex-wrap justify-content-between align-items-center gap-2 bg-body-tertiary border-bottom px-3 px-sm-4 py-3"
            >
              <span class="fw-semibold">AI 智能售货终端</span>
              <span id="terminal-status" class="small text-info" role="status"
                >待机</span
              >
            </header>
            <div
              id="app"
              class="terminal-screen d-grid gap-3 align-content-start p-3 p-sm-4"
            >
              <div class="d-flex flex-wrap align-items-center gap-3">
                <button id="start" class="btn btn-info" type="button">
                  开机
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      const start_btn = document.getElementById('start');
      start_btn.addEventListener('click', () => {
        attentionisallyouneed();
      });

      function attentionisallyouneed() {
        start_btn.disabled = true;

        const API_BASE = '/api/12/';

        const app = document.getElementById('app');
        const terminalStatus = document.getElementById('terminal-status');

        const state = {
          screen: 'boot',
          aiTapCount: 0,
          adminEntryUnlocked: false,

          selectedItem: null,
          selectedRoom: '',

          cashPending: false,
          cashTimer: null,

          adminLoggedIn: false,
          swipeCooling: false,
        };

        const items = [
          { id: 'cola', name: '可乐', price: 3, stock: 6 },
          { id: 'soda', name: '苏打水', price: 2, stock: 8 },
          { id: 'tea', name: '冰红茶', price: 4, stock: 5 },
          { id: 'chips', name: '薯片', price: 5, stock: 7 },
          { id: 'candy', name: '糖果', price: 2, stock: 11 },
        ];

        function createEl(tag, text = '', className = '') {
          const el = document.createElement(tag);
          el.textContent = text;
          el.className = className;
          return el;
        }

        function createButton(text, onClick, variant = 'info') {
          const btn = createEl('button', text, `btn btn-${variant}`);
          btn.type = 'button';
          btn.addEventListener('click', onClick);
          return btn;
        }

        function createNavigationButton(
          text,
          screen,
          variant = 'outline-light'
        ) {
          return createButton(text, () => setScreen(screen), variant);
        }

        function createActions(...buttons) {
          const row = createEl('div', '', 'action-row');
          row.append(...buttons);
          return row;
        }

        function createField(id, text, input) {
          const field = createEl('div');
          const label = createEl('label', text, 'form-label mb-1');
          label.htmlFor = id;
          input.id = id;
          input.className = 'form-control';
          field.append(label, input);
          return field;
        }

        function createResultBox() {
          const box = createEl(
            'div',
            '',
            'terminal-result rounded-3 border bg-body-tertiary px-3 py-2 text-break'
          );
          box.setAttribute('role', 'status');
          return box;
        }

        function setScreen(screen) {
          state.screen = screen;
          render();
        }

        function cleanupCashTimer() {
          if (state.cashTimer) {
            clearTimeout(state.cashTimer);
            state.cashTimer = null;
          }
        }

        function isValidRoomNumber(value) {
          if (!/^\d+$/.test(value)) return false;
          const num = Number(value);
          return num >= 1 && num <= 99;
        }

        async function postForm(url, dataObj) {
          const body = new URLSearchParams(dataObj).toString();
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
            },
            body: body,
            credentials: 'include',
          });

          let json;
          try {
            json = await response.json();
          } catch (err) {
            json = { message: '返回数据不是合法 JSON。' };
          }

          return {
            ok: response.ok,
            status: response.status,
            data: json,
          };
        }

        function render() {
          app.replaceChildren();
          terminalStatus.textContent =
            state.screen === 'boot' ? '启动中' : '运行中';

          switch (state.screen) {
            case 'boot':
              renderBoot();
              break;
            case 'attract':
              renderAttract();
              break;
            case 'mainMenu':
              renderMainMenu();
              break;
            case 'shop':
              renderShop();
              break;
            case 'checkout':
              renderCheckout();
              break;
            case 'delivery':
              renderDelivery();
              break;
            case 'adminLogin':
              renderAdminLogin();
              break;
            case 'adminPanel':
              renderAdminPanel();
              break;
            default:
              renderAttract();
          }
        }

        function renderBoot() {
          const title = createEl('h2', '启动日志', 'h4 mb-0');
          const spinner = createEl(
            'span',
            '',
            'spinner-border spinner-border-sm text-info'
          );
          spinner.setAttribute('aria-hidden', 'true');
          const log = createEl(
            'div',
            '',
            'font-monospace small text-body-secondary'
          );
          log.setAttribute('role', 'log');
          app.append(createActions(spinner, title), log);

          const lines = [
            '系统启动中...',
            'Inventory module loaded',
            'Internal logistics module loaded',
            'Currency parser loaded',
            'Remote auth bridge loaded',
          ];

          let index = 0;

          const timer = setInterval(function () {
            if (index < lines.length) {
              log.append(createEl('p', lines[index], 'mb-1'));
              index++;
            } else {
              clearInterval(timer);

              setTimeout(function () {
                if (state.screen === 'boot') {
                  setScreen('attract');
                }
              }, 1000);
            }
          }, 1000);
        }

        function renderAttract() {
          const title = createEl('h2', '欢迎使用自助售货服务。', 'h4 mb-0');
          const intro = createEl(
            'p',
            '请点击屏幕开始。',
            'text-body-secondary mb-0'
          );

          const aiLine = createEl(
            'button',
            '搭载最新 AI 系统!',
            'btn btn-link text-body-secondary text-decoration-none p-0'
          );
          aiLine.type = 'button';
          aiLine.addEventListener('click', function () {
            state.aiTapCount += 1;
            if (!state.adminEntryUnlocked && state.aiTapCount >= 5) {
              state.adminEntryUnlocked = true;
              alert('隐藏维护入口已解锁。');
            }
          });

          const startBtn = createNavigationButton('开始', 'mainMenu', 'info');

          app.append(
            title,
            intro,
            createActions(aiLine),
            createActions(startBtn)
          );
        }

        function renderMainMenu() {
          cleanupCashTimer();

          const title = createEl('h2', '主菜单', 'h4 mb-0');
          const buyBtn = createNavigationButton('购买', 'shop', 'info');
          const backBtn = createNavigationButton('返回', 'attract');

          app.append(title, createActions(buyBtn, backBtn));

          if (state.adminEntryUnlocked) {
            const adminBtn = createNavigationButton(
              '管理员入口',
              'adminLogin',
              'outline-info'
            );
            app.append(createActions(adminBtn));
          }
        }

        function renderShop() {
          cleanupCashTimer();

          const title = createEl('h2', '商品列表', 'h4 mb-0');
          const list = createEl('ul', '', 'list-group');

          items.forEach(function (item) {
            const row = createEl(
              'li',
              '',
              'list-group-item d-flex flex-wrap align-items-center justify-content-between gap-2'
            );
            const details = createEl('div');
            details.append(
              createEl('strong', item.name, 'd-block'),
              createEl(
                'span',
                `${item.price} 元 · 库存 ${item.stock}`,
                'text-body-secondary small'
              )
            );
            const btn = createButton(
              '选择',
              function () {
                state.selectedItem = item;
                state.cashPending = false;
                setScreen('checkout');
              },
              'outline-info'
            );

            row.append(details, btn);
            list.append(row);
          });

          const backBtn = createNavigationButton('返回主菜单', 'mainMenu');
          app.append(title, list, createActions(backBtn));
        }

        function renderCheckout() {
          const title = createEl('h2', '结算', 'h4 mb-0');
          app.append(title);

          if (!state.selectedItem) {
            const backBtn = createNavigationButton('返回商品列表', 'shop');
            app.append(
              createEl('p', '未选择商品。', 'mb-0'),
              createActions(backBtn)
            );
            return;
          }

          const summary = createEl(
            'div',
            '',
            'border rounded-3 bg-body-tertiary p-3'
          );
          const itemInfo = createEl(
            'p',
            `已选择商品：${state.selectedItem.name}，价格：${state.selectedItem.price} 元`,
            'fw-semibold mb-1'
          );
          const stockInfo = createEl(
            'p',
            `库存显示：${state.selectedItem.stock}`,
            'text-body-secondary small mb-0'
          );
          summary.append(itemInfo, stockInfo);
          const resultBox = createResultBox();

          const insert1Btn = createButton(
            '投入 1 元现金',
            () => handleInsertCash(1, resultBox, insert1Btn, insert5Btn),
            'outline-info'
          );

          const insert5Btn = createButton(
            '投入 5 元现金',
            () => handleInsertCash(5, resultBox, insert1Btn, insert5Btn),
            'outline-info'
          );

          const pickupBtn = createButton(
            '立即取出',
            function () {
              resultBox.innerHTML = '';
              resultBox.appendChild(createEl('p', '未完成支付，无法出货。'));
            },
            'outline-light'
          );

          const deliveryBtn = createNavigationButton(
            '配送',
            'delivery',
            'info'
          );

          const cancelBtn = createButton(
            '取消',
            function () {
              cleanupCashTimer();
              state.cashPending = false;
              state.selectedItem = null;
              setScreen('shop');
            },
            'outline-light'
          );

          app.append(
            summary,
            createActions(insert1Btn, insert5Btn),
            createActions(pickupBtn, deliveryBtn),
            resultBox,
            createActions(cancelBtn)
          );
        }

        function handleInsertCash(amount, resultBoxEl, insert1Btn, insert5Btn) {
          if (state.cashPending) {
            return;
          }

          cleanupCashTimer();
          state.cashPending = true;

          insert1Btn.disabled = true;
          insert5Btn.disabled = true;

          resultBoxEl.replaceChildren(
            createEl(
              'p',
              `（你投入了一张 ${amount} 元钞票。机器发出一阵轰隆声。）`
            )
          );

          state.cashTimer = setTimeout(function () {
            state.cashPending = false;
            insert1Btn.disabled = false;
            insert5Btn.disabled = false;

            resultBoxEl.replaceChildren(
              createEl(
                'p',
                '[错误] 无法识别的钞票',
                'text-danger-emphasis fw-semibold'
              ),
              createEl(
                'p',
                '（钞票被退回了。你与这台设备之间，似乎隔着过远的年代与技术差异。）'
              )
            );
          }, 2500);
        }

        function renderDelivery() {
          cleanupCashTimer();

          const title = createEl('h2', '配送', 'h4 mb-0');
          const itemLine = createEl(
            'p',
            state.selectedItem
              ? '当前商品：' + state.selectedItem.name
              : '当前无商品',
            'text-body-secondary mb-0'
          );

          const input = document.createElement('input');
          input.type = 'text';
          input.inputMode = 'numeric';
          input.value = state.selectedRoom;
          input.placeholder = '例如 12';

          const resultBox = createResultBox();
          let confirmedRoom = '';

          const confirmBtn = createButton('确认订单', function () {
            state.selectedRoom = input.value.trim();

            if (!isValidRoomNumber(state.selectedRoom)) {
              resultBox.replaceChildren(
                createEl('p', '房间号无效。请输入 1-99 的数字。')
              );
              return;
            }

            setConfirmedRoom(state.selectedRoom);
            resultBox.replaceChildren(
              createEl('p', '目标房间：' + state.selectedRoom),
              createEl('p', '房间存在。'),
              createEl('p', '配送需验证对应房间 ID 卡。'),
              createEl('p', '请刷卡以继续。')
            );
          });
          confirmBtn.id = 'confirm-order';
          confirmBtn.disabled = state.swipeCooling;

          const swipeBtn = createButton('刷卡', function () {
            if (
              !confirmedRoom ||
              confirmedRoom !== input.value.trim() ||
              state.swipeCooling
            ) {
              return;
            }

            state.swipeCooling = true;
            setConfirmedRoom('');
            confirmBtn.disabled = true;

            const cooldownNote = createEl('p', '读卡器冷却中，请稍后再试。');
            resultBox.replaceChildren(
              createEl('p', '正在检测 ID 卡...'),
              createEl('p', '未检测到有效 ID 卡。'),
              createEl('p', '配送验证失败。'),
              cooldownNote
            );

            setTimeout(function () {
              state.swipeCooling = false;
              const currentConfirm = document.getElementById('confirm-order');
              if (currentConfirm) currentConfirm.disabled = false;
              cooldownNote.remove();
            }, 2000);
          });

          function setConfirmedRoom(room) {
            confirmedRoom = room;
            confirmBtn.hidden = Boolean(room);
            swipeBtn.hidden = !room;
          }

          setConfirmedRoom('');
          input.addEventListener('input', () => {
            if (confirmedRoom && input.value.trim() !== confirmedRoom) {
              setConfirmedRoom('');
              resultBox.replaceChildren();
            }
          });

          const backBtn = createNavigationButton('返回结算', 'checkout');

          app.append(
            title,
            itemLine,
            createField('delivery-room', '目标房间号（1–99）', input),
            createActions(confirmBtn, swipeBtn),
            resultBox,
            createActions(backBtn)
          );
        }

        function renderAdminLogin() {
          cleanupCashTimer();

          const title = createEl('h2', '管理员登录', 'h4 mb-0');
          const intro = createEl(
            'p',
            '此系统受到严格保护，密码每天轮动更新，以确保无法猜测4位随机生成的数字。',
            'text-body-secondary mb-0'
          );

          const usernameInput = document.createElement('input');
          usernameInput.type = 'text';
          usernameInput.value = 'admin';
          usernameInput.placeholder = '用户名';
          usernameInput.disabled = true;

          const passwordInput = document.createElement('input');
          passwordInput.type = 'password';
          passwordInput.placeholder = '密码';

          const resultBox = createResultBox();

          const loginBtn = createButton('登录', async function () {
            resultBox.innerHTML = '';
            loginBtn.disabled = true;

            try {
              const result = await postForm(API_BASE + 'login', {
                username: 'admin',
                password: passwordInput.value,
              });

              if (result.status !== 200) {
                resultBox.appendChild(
                  createEl('p', result.data.message || 'internal server error')
                );
                return;
              }

              resultBox.appendChild(createEl('p', result.data.message));

              state.adminLoggedIn = true;
              setScreen('adminPanel');
            } catch (err) {
              resultBox.appendChild(createEl('p', '网络请求失败。'));
            } finally {
              loginBtn.disabled = false;
            }
          });

          const backBtn = createNavigationButton('返回主菜单', 'mainMenu');

          app.append(
            title,
            intro,
            createField('admin-username', '用户名', usernameInput),
            createField('admin-password', '密码', passwordInput),
            createActions(loginBtn, backBtn),
            resultBox
          );
        }

        function renderAdminPanel() {
          cleanupCashTimer();

          const title = createEl('h2', '管理员面板', 'h4 mb-0');
          const intro = createEl(
            'p',
            '已进入管理员模式。',
            'text-body-secondary mb-0'
          );

          const roomInput = document.createElement('input');
          roomInput.type = 'text';
          roomInput.inputMode = 'numeric';
          roomInput.placeholder = '1-99';
          roomInput.value = state.selectedRoom || '';

          const resultBox = createResultBox();

          const queryBtn = createButton('查询房间信息', async function () {
            resultBox.innerHTML = '';
            const roomValue = roomInput.value.trim();
            state.selectedRoom = roomValue;

            if (!/^\d+$/.test(roomValue)) {
              resultBox.appendChild(createEl('p', '房间号仅支持数字。'));
              return;
            }

            queryBtn.disabled = true;

            try {
              const result = await getWithQuery(API_BASE + 'get_room_info', {
                room_id: roomValue,
              });

              if (result.status !== 200) {
                resultBox.appendChild(createEl('p', result.data.message));
                return;
              }

              resultBox.appendChild(createEl('p', result.data.message));

              Object.keys(result.data).forEach(function (key) {
                if (key === 'message') return;
                const value = result.data[key];
                resultBox.appendChild(
                  createEl('p', key + ': ' + String(value))
                );
              });
            } catch (err) {
              resultBox.appendChild(createEl('p', '网络请求失败。'));
            } finally {
              queryBtn.disabled = false;
            }
          });

          const backBtn = createButton(
            '退出管理员面板',
            function () {
              state.adminLoggedIn = false;
              setScreen('mainMenu');
            },
            'outline-light'
          );

          app.append(
            title,
            intro,
            createField('admin-room', '查询房间号', roomInput),
            createActions(queryBtn, backBtn),
            resultBox
          );
        }

        async function getWithQuery(url, queryObj) {
          const query = new URLSearchParams(queryObj).toString();
          const response = await fetch(url + '?' + query, {
            method: 'GET',
            credentials: 'include',
          });

          let json;
          try {
            json = await response.json();
          } catch (err) {
            json = { message: '返回数据不是合法 JSON。' };
          }

          return {
            ok: response.ok,
            status: response.status,
            data: json,
          };
        }

        render();
      }
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
