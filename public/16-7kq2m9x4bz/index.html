<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/challenge-theme.css" />
    <title>16 - A Magic Museum</title>
  </head>

  <body class="challenge-page">
    <main class="page-shell container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <section class="card puzzle-card shadow-sm">
            <div class="card-body p-4 p-md-5 puzzle-copy">
              <h1 class="display-6 fw-bold mb-3">16 - A Magic Museum</h1>
              <p class="text-secondary mb-2">
                你成功穿过了迷宫，进入了一个新的房间。
              </p>
              <p class="text-secondary mb-2">
                角落里有一块布满尘埃的展台，你轻轻触碰了一下，屏幕却意外点亮了。
              </p>
              <p class="text-secondary mb-2">
                更加神奇的是，这块展台似乎具有特殊的魔力，
              </p>
              <p class="text-secondary mb-2">
                可以选择任意一个时间点，查看对应时间人类的发展进程。
              </p>
              <p class="text-secondary mb-0">你会查看哪些时间点呢？</p>
              <div class="action-stack mt-4">
                <div class="action-row">
                  <input
                    class="form-control"
                    style="max-width: 20rem"
                    type="number"
                    id="timepoint"
                    placeholder="请输入年份, 格式为 yyyy"
                  />
                  <button id="getresult" class="btn btn-primary" type="button">
                    Get Result
                  </button>
                </div>
                <p id="result" class="result-panel" role="status"></p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      const timepoint = document.getElementById('timepoint');
      const result = document.getElementById('result');

      document
        .getElementById('getresult')
        .addEventListener('click', async () => {
          result.textContent = '';
          const query = new URLSearchParams({ timepoint: timepoint.value });
          const source = new URL(location.pathname, location.origin);
          source.searchParams.set(
            'timepoint',
            String(new Date().getFullYear())
          );

          try {
            const response = await fetch(`/api/16?${query}`, {
              referrer: source.href,
              referrerPolicy: 'same-origin',
            });
            const data = await response.json();
            if (typeof data?.message !== 'string') {
              throw new Error('Invalid response.');
            }
            result.textContent = data.message;
          } catch (err) {
            result.textContent = '暂时无法查询，请稍后再试。';
            console.error(err);
          }
        });
    </script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
